[preset.0]

name="Quest"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="radio_secrets.cfg"
exclude_filter="tests/*, textures/*/*_height.png, textures/*/*_ao.png, textures/*/*_metallic.png, textures/*/*_roughness.png, textures/*/*_preview.jpg"
export_path="build/stunt-track-vr.apk"

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.stunttrackvr.game"
package/name="Canion Raid VR"
package/signed=true
package/show_in_app_library=true
package/show_as_launcher_app=false
screen/immersive_mode=true
xr_features/xr_mode=1
xr_features/enable_meta_plugin=true
meta_xr_features/quest_2_support=false
meta_xr_features/quest_3_support=true
meta_xr_features/quest_pro_support=false
meta_xr_features/hand_tracking=0
meta_xr_features/passthrough=0
permissions/internet=true
